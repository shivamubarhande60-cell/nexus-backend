# Nexus Screening Backend - Application Configuration
server.port=8081

# Spring Application Name
spring.application.name=nexus-backend

# In-Memory H2 Database for immediate local testing without requiring MySQL service running
# (Can be switched to MySQL by changing the datasource URL below)
spring.datasource.url=jdbc:h2:mem:nexusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.nexus.screening=DEBUG

# AI/ML Service Integration URL (BE-25)
nexus.ml.service.url=http://localhost:5000/predict

